# 公開リポジトリに、IP アドレス・トークン・メールアドレスなど公開してはいけない文字列が入っていないかを調べる。
# PR ごと(デスクや Claude の変更)と、main への push(本社の publish が記事を直接置くとき)に動く。
# 引っかかったら赤くなる。PR はマージしない。main なら記事を直して push し直す(build.py も記事を公開しない)。
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/secret_scan.py
