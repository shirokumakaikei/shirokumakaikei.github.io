# PRごとにビルド検証。落ちていたらマージしない。
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - run: python tools/build.py --check
        env: { TZ: Asia/Tokyo }
