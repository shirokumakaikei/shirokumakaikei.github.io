# mainに入ったらビルドしてGitHub Pagesへ公開。毎朝6:10(JST)にも走らせ、日付指定の予約記事を公開する。
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - run: python tools/build.py --out _site
        env: { TZ: Asia/Tokyo }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
