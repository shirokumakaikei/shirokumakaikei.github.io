<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>決裁デスク | しろくま</title>
<link rel="icon" href="data:,">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
/* スマホ1列。上から「要対応 → AI社員の稼働 → 方向を決める」。あなたが押すボタンだけオレンジ */
:root {
  --bg: #f4f7fa; --card: #ffffff; --fg: #172231; --muted: #5a6a7e; --line: #d5dde7;
  --accent: #1f5585; --accent-soft: #e6eef6; --act: #b4541f; --act-soft: #fbeee5;
  --ok: #2e7d4f; --warn: #a86a00; --ng: #b23b3b;
  --font: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #10161e; --card: #18212c; --fg: #e4ebf2; --muted: #9aaabd; --line: #2f3c4d;
    --accent: #84b6e4; --accent-soft: #1d2a38; --act: #f0a070; --act-soft: #3a2619;
    --ok: #6cc28f; --warn: #e3b14f; --ng: #ef7d7d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
header.top h1 { font-size: 1.05rem; margin: 0; flex: 1; letter-spacing: 0.04em; }
button, .btn { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  padding: 8px 14px; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.ghost { background: transparent; }
button.act { background: var(--act); border-color: var(--act); color: #fff; font-weight: 700; }
button.sub { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
button.danger { color: var(--ng); }
button.armed { outline: 2px solid currentColor; }
button:disabled { opacity: 0.5; cursor: default; }
h2 { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.08em; margin: 28px 0 10px; font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.list { display: grid; gap: 0; }
.item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; }
.item { flex-wrap: wrap; }
/* 縦画面で文字の欄がつぶれないよう、本文は最低12文字ぶんの幅を取り、入りきらない操作部品は下の行に回す */
.item .main { flex: 1 1 12em; min-width: 0; }
.item .ctl { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.item .main .chip { display: inline-block; margin-bottom: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: 0.82rem; }
.chip { font-size: 0.72rem; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.draft { color: var(--act); } .chip.editor { color: var(--accent); } .chip.ops { color: var(--ng); }
.chip.ok { color: var(--ok); } .chip.run { color: var(--warn); } .chip.ng { color: var(--ng); } .chip.idle { color: var(--muted); } .chip.warn { color: var(--warn); }
.empty { padding: 16px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 12px; }
.pad { padding: 16px; }
.warn { border-left: 4px solid var(--warn); background: var(--act-soft); padding: 12px 14px; border-radius: 8px; }
.warn h3 { margin: 0 0 6px; font-size: 0.9rem; }
.md { overflow-wrap: anywhere; }
.md h1 { font-size: 1.1rem; } .md h2 { font-size: 1rem; color: var(--fg); letter-spacing: 0; margin: 18px 0 6px; }
.md h3 { font-size: 0.95rem; margin: 14px 0 4px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 0.85rem; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
.md code { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
iframe.preview { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff; min-height: 400px; }
textarea, input[type=text], input[type=password], select { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea { min-height: 96px; resize: vertical; }
/* 自分で直す: 画面幅いっぱい、保存・やめるは大きくして下に固定 */
.body-editor { display: block; width: calc(100% + 32px); margin: 0 -16px; min-height: calc(100vh - 230px); min-height: calc(100dvh - 230px); font-size: 16px; line-height: 1.75; padding: 12px 16px; border-radius: 0; border-left: 0; border-right: 0; }
.fixbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.fixbar .wrap { padding: 0; display: grid; gap: 8px; }
.fixbar .btns { display: flex; gap: 10px; }
.fixbar .btns button { flex: 1; min-height: 54px; font-size: 1.05rem; }
.fixbar .btns button.act { flex: 2; }
.vcheck ul { margin: 6px 0 0; padding-left: 18px; } .vcheck li.v-ng { color: var(--ng); } .vcheck li.v-warn { color: var(--warn); } .vcheck li.v-ok { color: var(--ok); }
[hidden] { display: none !important; }
label { font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
.bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin-top: 16px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; z-index: 10; max-width: 90vw; }
.meta { color: var(--muted); font-size: 0.82rem; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { margin-top: 5px; width: 20px; height: 20px; flex: none; }
.count { min-width: 1.6em; text-align: center; font-weight: 700; color: var(--act); }
@media (prefers-reduced-motion: no-preference) { .item:active { background: var(--accent-soft); } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="ghost" id="back" hidden aria-label="戻る">←</button>
  <h1 id="title">決裁デスク</h1>
  <button class="ghost" id="reload" aria-label="更新">更新</button>
  <button class="ghost" id="settingsBtn" aria-label="設定">設定</button>
</div></header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

<script>
// このスクリプト自身の中身。公開中のデスクと比べて、新しくなっていたら読み込み直す(checkDeskUpdate)
const SELF = document.currentScript ? document.currentScript.textContent : "";
"use strict";
// 本社(非公開)にAI社員の下書き・ネタ帳・体験がある。公開サイトのリポジトリは公開処理の状況を見るだけ
const OFFICE = "shirokumakaikei/shirokuma-office";
const SITE_REPO = "shirokumakaikei/shirokumakaikei.github.io";
const SITE = "https://shirokumakaikei.github.io";
const API = "https://api.github.com";
const CATS = ["実務", "キャリア・転職", "試験・学習"];
const WORKFLOWS = [
  { repo: OFFICE, file: "nightly.yml", label: "ライター+校閲(今夜の担当)", runnable: true, channelInput: true },
  { repo: OFFICE, file: "comment.yml", label: "書き直し・英訳", runnable: false },
  { repo: OFFICE, file: "weekly.yml", label: "アナリスト+編集長", runnable: true },
  { repo: OFFICE, file: "publish.yml", label: "サイトへの反映", runnable: false },
  { repo: SITE_REPO, file: "deploy.yml", label: "サイト公開処理", runnable: true },
];
const STAGE_LABEL = { ja: "日本語版", en: "英語版", final: "下書き" };

const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get("desk.token");

const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => DOMPurify.sanitize(marked.parse(String(s || "")));
// 広告の目印はプレビューでは仮の枠で見せる(本物のコードを読み込むと表示回数が計上されるため)
// types: 目印の名前 → "service" | "product"(わかれば。商品はボックスの仮枠で出す)
const adPreview = (s, types = {}) => String(s || "").replace(/^\[\[ad:([a-z0-9-]+)(:banner)?\]\]\s*$/gm, (_, n, b) => types[n] === "product"
  ? `\n<div class="ad-product"><p class="ad-product-label">記事で触れた商品</p><div style="display:flex;align-items:center;justify-content:center;min-height:120px;border:2px dashed #b9c6d6;color:#4a5a70">商品リンク: ${n}</div></div>\n`
  : b
  ? `\n<div class="ad-banner"><div style="display:inline-flex;align-items:center;justify-content:center;width:300px;max-width:100%;height:250px;border:2px dashed #b9c6d6;color:#4a5a70">広告バナー: ${n}</div></div>\n`
  : `\n<div class="ad-text"><a href="#">広告(文字リンク): ${n}</a></div>\n`);
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${m}分前`;
  if (m < 60 * 24) return `${Math.round(m / 60)}時間前`;
  return `${Math.round(m / 1440)}日前`;
};
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200);
}
function b64decode(s) {
  const bin = atob(s.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function twoTap(btn, label, fn) {
  btn.addEventListener("click", async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); const orig = btn.textContent; btn.textContent = label;
      setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 4000);
      return;
    }
    btn.disabled = true;
    try { await fn(); } catch (e) { toast(e.message); btn.disabled = false; }
  });
}

// ---------- GitHub API ----------
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (res.status === 401) throw new Error("トークンが無効です。設定から入れ直してください");
  if (!res.ok && res.status !== 204) {
    let msg = res.statusText; try { msg = (await res.json()).message || msg; } catch {}
    if (res.status === 403 || res.status === 404) msg += "(トークンの権限と対象リポジトリを確認してください)";
    throw new Error(`GitHub ${res.status}: ${msg}`);
  }
  return res.status === 204 ? null : res.json();
}
const R = `/repos/${OFFICE}`;
const getFile = async (path, ref, repo = OFFICE) => {
  const j = await gh(`/repos/${repo}/contents/${path}${ref ? `?ref=${encodeURIComponent(ref)}` : ""}`);
  return { text: b64decode(j.content), sha: j.sha };
};
const putFile = (path, text, sha, message, branch) =>
  gh(`${R}/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64encode(text), sha, ...(branch ? { branch } : {}) }) });
const putFileTo = (repo, path, text, sha, message) =>
  gh(`/repos/${repo}/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64encode(text), ...(sha ? { sha } : {}) }) });
const labelOf = (p, prefix) => (p.labels.find((l) => l.name.startsWith(prefix)) || {}).name?.slice(prefix.length) || "";

// 媒体の一覧(channels/*/channel.yml)
let channelsCache = null;
async function loadChannels() {
  if (channelsCache) return channelsCache;
  const dirs = (await gh(`${R}/contents/channels`)).filter((d) => d.type === "dir" && !d.name.startsWith("_"));
  const list = await Promise.all(dirs.map(async (d) => {
    try {
      const y = (await getFile(`channels/${d.name}/channel.yml`)).text;
      const get = (k) => (y.match(new RegExp(`^${k}:\\s*(.+)$`, "m")) || [])[1]?.replace(/\s+#.*$/, "").trim();
      return { id: d.name, name: get("name") || d.name, enabled: get("enabled") === "true",
               types: /^types:/m.test(y), categories: /^categories:/m.test(y), twoStage: get("two_stage") === "true",
               research: get("research") || "false", publish: get("publish") || "", raw: y };
    } catch { return null; }
  }));
  channelsCache = list.filter(Boolean);
  return channelsCache;
}
const chName = (id) => (channelsCache || []).find((c) => c.id === id)?.name || id;

// ---------- 画面遷移 ----------
const history_ = [];
let current = null;
function go(fn, title, push = true) {
  if (push && current) history_.push(current);
  current = { fn, title };
  $("#title").textContent = title; $("#back").hidden = history_.length === 0;
  view.innerHTML = '<p class="empty">読み込み中…</p>';
  window.scrollTo(0, 0);
  fn().catch((e) => { view.innerHTML = `<div class="card pad"><p>${esc(e.message)}</p></div>`; });
}
$("#back").onclick = () => { const p = history_.pop(); if (p) go(p.fn, p.title, false); };
$("#reload").onclick = async () => { if (await checkDeskUpdate()) return; channelsCache = null; current && go(current.fn, current.title, false); };
// スマホのブラウザは古いデスクを持ち続けることがある。公開中のデスクを取り直し、中身が違えば読み込み直す
async function checkDeskUpdate() {
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!r.ok || !SELF) return false;
    if ((await r.text()).includes(SELF)) return false;
    let last = 0; try { last = +(sessionStorage.getItem("desk.reloadAt") || 0); } catch {}
    if (Date.now() - last < 60000) return false;  // 読み込み直しが続かないように1分に1回まで
    try { sessionStorage.setItem("desk.reloadAt", String(Date.now())); } catch {}
    toast("デスクが新しくなったので読み込み直します");
    location.replace(location.pathname + "?v=" + Date.now() + location.hash);
    return true;
  } catch { return false; }
}
$("#settingsBtn").onclick = () => go(settings, "設定");
const home = () => { history_.length = 0; go(inbox, "決裁デスク", false); };

// ---------- 設定 ----------
async function settings() {
  view.innerHTML = `
  <h2>このブラウザに保存するトークン</h2>
  <div class="card pad stack">
    <p class="meta">GitHub の fine-grained token を入れてください。保存先はこの端末のブラウザだけで、GitHubへの操作にだけ使います。</p>
    <label>トークン<input type="password" id="tok" autocomplete="off" value="${token ? "••••••••" : ""}"></label>
    <div class="row"><button class="act" id="save">保存</button><button class="danger" id="logout">この端末から削除</button></div>
    <details><summary class="meta">トークンの作り方</summary>
      <ol class="meta">
        <li>GitHub → Settings → Developer settings → Fine-grained tokens</li>
        <li>Resource owner: <b>shirokumakaikei</b> / Repository access: <b>shirokuma-office</b> と <b>shirokumakaikei.github.io</b></li>
        <li>Permissions: Contents・Pull requests・Issues・Actions を Read and write</li>
      </ol></details>
  </div>
  <h2>スマホに通知を出すには</h2>
  <div class="card pad meta">GitHub アプリで <b>shirokuma-office</b> を Watch → All Activity にすると、下書きができたときに通知が来ます。</div>`;
  $("#save").onclick = async () => {
    const v = $("#tok").value.trim();
    if (!v || v.startsWith("•")) return toast("トークンを入力してください");
    token = v;
    try { await gh(R); store.set("desk.token", v); toast("保存しました"); home(); }
    catch (e) { token = store.get("desk.token"); toast(e.message); }
  };
  $("#logout").onclick = () => { store.del("desk.token"); token = ""; toast("この端末から削除しました"); settings(); };
}

// ---------- 受信箱 ----------
async function inbox() {
  if (!token) return settings();
  const [pulls, ops, reports, runs, siteRuns, chans] = await Promise.all([
    gh(`${R}/pulls?state=open&per_page=50`),
    gh(`${R}/issues?labels=ops&state=open&per_page=5`),
    gh(`${R}/issues?labels=analyst-report&state=all&per_page=1`),
    gh(`${R}/actions/runs?per_page=40`).catch(() => ({ workflow_runs: [] })),
    gh(`/repos/${SITE_REPO}/actions/runs?per_page=10`).catch(() => ({ workflow_runs: [] })),
    loadChannels().catch(() => []),
  ]);
  const has = (p, l) => p.labels.some((x) => x.name === l);
  const todo = [
    ...pulls.filter((p) => labelOf(p, "channel:") && !has(p, "editor")).map((p) => {
      const ch = labelOf(p, "channel:"), st = labelOf(p, "stage:") || "final";
      return { kind: st === "ja" ? "editor" : "draft", chip: `${chName(ch)}・${STAGE_LABEL[st] || st}${has(p, "要確認") ? "・要確認" : ""}`,
               t: p.title.replace(/^\[[^\]]*\]\s*/, "").replace(/^(日本語版|英語版)[:：]\s*/, ""), m: ago(p.updated_at || p.created_at),
               open: () => go(() => draft(p.number), STAGE_LABEL[st] || "下書き") };
    }),
    ...pulls.filter((p) => has(p, "editor")).map((p) => ({ kind: "editor", chip: `編集長・${chName(labelOf(p, "channel:"))}`,
      t: p.title.replace(/^\[編集長\]\s*/, ""), m: ago(p.created_at), open: () => go(() => proposal(p.number), "ネタの提案") })),
    ...ops.map((i) => ({ kind: "ops", chip: "運用", t: i.title, m: `${ago(i.updated_at)} / コメント${i.comments}件`,
      open: () => go(() => opsView(i.number), "運用のお知らせ") })),
  ];
  const lastRun = (w) => ((w.repo === OFFICE ? runs : siteRuns).workflow_runs || []).find((r) => r.path?.endsWith("/" + w.file));
  const runChip = (r) => {
    if (!r) return '<span class="chip idle">未実行</span>';
    if (r.status !== "completed") return '<span class="chip run">実行中</span>';
    if (r.conclusion === "success") return '<span class="chip ok">完了</span>';
    if (r.conclusion === "skipped" || r.conclusion === "cancelled") return '<span class="chip idle">スキップ</span>';
    return '<span class="chip ng">失敗</span>';
  };
  const enabled = chans.filter((c) => c.enabled);
  const rep = reports[0];
  view.innerHTML = `
  <h2>要対応 <span class="count">${todo.length}</span></h2>
  <div class="card list" id="todo">${todo.length ? "" : '<p class="empty">いま判断が必要なものはありません。</p>'}</div>
  <h2>週報</h2>
  <div class="card list">${rep ? `<button class="item" id="rep"><div class="main"><div class="t">${esc(rep.title)}</div><div class="m">${ago(rep.created_at)}</div></div>›</button>` : '<p class="empty">まだ週報はありません。</p>'}</div>
  <h2>AI社員の稼働</h2>
  <div class="card list">${WORKFLOWS.map((w, i) => { const r = lastRun(w); return `
    <div class="item" style="cursor:default"><div class="main"><div class="t">${w.label}</div>
      <div class="m">${r ? ago(r.created_at) : "記録なし"}${r && r.html_url ? ` ・ <a href="${esc(r.html_url)}" target="_blank" rel="noopener">ログ</a>` : ""}</div></div>
      <div class="ctl">${runChip(r)}
      ${w.channelInput ? `<select data-ch="${i}" aria-label="媒体" style="width:auto">${enabled.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select>` : ""}
      ${w.runnable ? `<button class="sub" data-run="${i}">今すぐ</button>` : ""}</div></div>`; }).join("")}</div>
  <h2>方向を決める</h2>
  <div class="card list">
    <button class="item" id="addTopic"><div class="main"><div class="t">ネタを追加する</div><div class="m">媒体を選んで、次に書かせるテーマを入れる</div></div>›</button>

function splitFront(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return { meta: {}, body: text };
  const meta = {};
  m[1].split("\n").forEach((l) => { const k = l.match(/^(\w+):\s*(.*)$/); if (k) meta[k[1]] = k[2].replace(/^"(.*)"$/, "$1"); });
  return { meta, body: m[2] };
}
function warningsFrom(report) {
  const m = String(report || "").match(/### ⚠[^\n]*\n([\s\S]*?)(?=\n#{2,3} |\n*$)/);
  return m ? m[0] : "";
}
async function copyRich(html, plain) {
  try {
    if (window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([plain], { type: "text/plain" }) })]);
    } else { await navigator.clipboard.writeText(plain); }
    toast("コピーしました。投稿画面に貼り付けてください");
  } catch { toast("コピーできませんでした。プレビューを長押しして全選択→コピーしてください"); }
}

const HUMAN_LABEL = "人が手直し済み";
const lastCheck = {};  // 保存後の検証結果(PR 番号ごと)。下書き画面の上に出す
function splitRaw(text) {  // front matter はそのまま残し、本文だけを差し替えるため
  const m = text.match(/^(---\n[\s\S]*?\n---\n)([\s\S]*)$/);
  return m ? { front: m[1], body: m[2] } : { front: "", body: text };
}
const flat = (s) => String(s).replace(/\s+/g, "");
// 手直しした段落(新しく出てきた行)。見出しも含む。空行は除く
function changedLines(before, after) {

  return after.split("\n").map((l) => l.trim()).filter((l) => l && !old.has(l));
}
async function draftCtx(n) {

  const pick = (re) => files.map((f) => f.filename).find((f) => re.test(f));
  const mdPath = st === "ja" ? pick(/\.ja\.md$/) || `drafts/${ch}/${slug}.ja.md` : pick(new RegExp(`${slug}\\.md$`)) || `drafts/${ch}/${slug}.md`;
  return { pr, ch, st, slug, mdPath, humanPath: mdPath.replace(/\.md$/, ".human.json") };
}
// 自分で直せる下書き: しろくま会計と note、Inside Japan Tax は日本語版(stage:ja)だけ
const canSelfEdit = (ch, st) => ch === "site" || ch === "note" || (ch === "substack" && st === "ja");

// 書きかけはこの端末に残す(閉じても次に開いたとき戻せる)。{sha: 開いた元の版, body, at}
const editKey = (n, path) => `desk-edit:${n}:${path}`;
const loadEdit = (k) => { try { return JSON.parse(store.get(k) || "null"); } catch { return null; } };

async function editBody(n) {

  const f = await getFile(c.mdPath, c.pr.head.ref);

  view.innerHTML = `
  <p class="meta" style="margin-top:12px">本文(Markdown)を直接直せます。見出しは「## 」、太字は「**」で囲みます。打った内容はこの端末に自動で残ります。保存すると、このPRに「${EDIT_MSG}」として記録され、直した段落は次の修正依頼やファクトチェックで AI が書き換えません。</p>
  <div id="resume"></div>
  <textarea class="body-editor" id="body" spellcheck="false">${esc(body)}</textarea>
  <div style="height:140px"></div>
  <div class="fixbar"><div class="wrap"><div class="row" style="justify-content:space-between"><span class="meta" id="cnt"></span><span class="meta" id="kept"></span></div>
    <div class="btns"><button class="sub" id="cancel">やめる</button><button class="act" id="saveBody">保存</button></div></div></div>`;
  const ta = $("#body");

    $("#kept").textContent = "書きかけを端末に保存済み";
  };
  let timer = 0, touched = false;  // 触っていないうちは端末の書きかけを消さない(開いて閉じただけで古い書きかけが消えないように)
  ta.oninput = () => { touched = true; count(); clearTimeout(timer); timer = setTimeout(keep, 400); };
  const flush = () => { clearTimeout(timer); if (touched && document.body.contains(ta)) keep(); };
  window.addEventListener("pagehide", flush, { once: true });
  count();
  const discard = () => { store.del(key); ta.value = body; count(); $("#kept").textContent = ""; $("#resume").innerHTML = ""; toast("書きかけを捨てました"); };
  if (pending && pending.sha === f.sha) {
    ta.value = pending.body; count(); $("#kept").textContent = "書きかけを端末に保存済み";
    $("#resume").innerHTML = `<div class="card pad row" style="justify-content:space-between;margin:8px 0"><span class="meta">${when(pending.at)} の書きかけを戻しました</span><button class="ghost" id="drop">書きかけを捨てる</button></div>`;
    $("#drop").onclick = discard;
  } else if (pending) {
    $("#resume").innerHTML = `<div class="warn stack" style="margin:8px 0"><div>${when(pending.at)} の書きかけがあります。そのあと AI が下書きを更新しました。いまは最新の下書きを表示しています。</div>
      <div class="row"><button class="sub" id="useOld">書きかけを開く(AI の更新は消える)</button><button class="ghost" id="drop">書きかけを捨てる</button></div></div>`;
    $("#drop").onclick = discard;
    $("#useOld").onclick = () => { ta.value = pending.body; count(); $("#resume").innerHTML = ""; touched = true; keep(); toast("書きかけを開きました。保存すると AI の更新は上書きされます"); };
  }
  $("#cancel").onclick = () => { flush(); if (ta.value !== body) toast("書きかけはこの端末に残しました"); $("#back").click(); };
  $("#saveBody").onclick = async () => {
    const next = ta.value.replace(/\s+$/, "") + "\n";
    if (next === body) return toast("変更がありません");
    flush();
    $("#saveBody").disabled = true;
    try {
      const cur = await getFile(c.mdPath, c.pr.head.ref);
      if (cur.sha !== f.sha) throw new Error("開いたあとに AI が下書きを更新したので、保存していません。書きかけはこの端末に残してあります。「やめる」で戻って開き直してください");
      await putFile(c.mdPath, front + next, cur.sha, EDIT_MSG, c.pr.head.ref);
      // 手直しした段落を記録する(前からの記録で今も残っているもの + 今回の変更)
      const h = await getFile(c.humanPath, c.pr.head.ref).catch(() => null);
      let rec = { protected: [], history: [] }; try { if (h) rec = { ...rec, ...JSON.parse(h.text) }; } catch {}
      const kept = [...rec.protected.filter((p) => flat(next).includes(flat(p))), ...changedLines(body, next)];
      rec.protected = [...new Set(kept)];

      const res = await putFile(c.humanPath, JSON.stringify(rec, null, 1) + "\n", h?.sha, `${EDIT_MSG}(直した段落の記録)`, c.pr.head.ref);
      store.del(key);
      await gh(`${R}/issues/${n}/labels`, { method: "POST", body: JSON.stringify({ labels: [HUMAN_LABEL] }) }).catch(() => {});
      lastCheck[n] = { ...(await checkBody(c, front + next)), sha: res?.commit?.sha || "" };
      toast("保存しました。PR の本文の検証が始まります"); history_.pop(); go(() => draft(n), "下書き", false);
    } catch (e) { toast(e.message); $("#saveBody").disabled = false; }
  };
}

// PR の「本文の検証」(本社の draft-check.yml)。保存の push で走り、結果を PR にコメントする
const CHECK_WF = "draft-check.yml";
async function prCheck(el, n, sha, comments, waiting) {
  if (!document.body.contains(el)) return;
  const mark = `<!-- draft-check sha=${sha} -->`;
  const hit = [...comments].reverse().find((c) => c.body.includes(mark));
  if (hit) {
    const ok = /本文の検証: 問題なし/.test(hit.body);
    el.innerHTML = `<details class="card pad vcheck" ${ok ? "" : "open"}><summary><b>PR の本文の検証</b> <span class="meta">${ok ? "問題なし" : "直す点があります"}</span></summary>
      <div class="md">${md(hit.body.replace(mark, "").replace(/^###[^\n]*\n/m, ""))}</div></details>`;
    return;
  }
  let run = null;
  try { run = (await gh(`${R}/actions/workflows/${CHECK_WF}/runs?head_sha=${sha}&per_page=5`)).workflow_runs?.[0] || null; } catch { if (!waiting) return; }
  if (!run && !waiting) { el.innerHTML = ""; return; }
  if (run && run.status === "completed") {
    const cs = await gh(`${R}/issues/${n}/comments?per_page=100`).catch(() => []);
    if (cs.some((c) => c.body.includes(mark))) return prCheck(el, n, sha, cs, waiting);
    if (!["success", "failure"].includes(run.conclusion)) {
      el.innerHTML = `<div class="card pad vcheck"><b>PR の本文の検証</b> <span class="meta">${esc(run.conclusion || "")}で終わりました。<a href="${esc(run.html_url)}" target="_blank" rel="noopener">実行を開く</a></span></div>`;
      return;
    }
  }
  el.innerHTML = `<div class="card pad vcheck"><b>PR の本文の検証</b> <span class="meta">${run ? "検証中…" : "開始を待っています…"}(1〜2分。この画面のまま待てば結果が出ます)</span></div>`;
  setTimeout(() => prCheck(el, n, sha, comments, waiting), 15000);
}

// ---------- 本文の検証(本社の office.py の validate と同じ考え方の簡易版) ----------
let ngCache = null;
async function ngWords() {  // voice-tone の NG表現リスト(tools/thumb.py と同じ読み方)
  if (ngCache) return ngCache;
  const t = (await getFile("skills/voice-tone/SKILL.md").catch(() => ({ text: "" }))).text;
  const sec = (t.match(/^## [^\n]*NG表現リスト[^\n]*\n([\s\S]*?)(?=^## |(?![\s\S]))/m) || [])[1] || "";
  const out = [];
  for (const line of sec.split("\n")) {
    if (line.includes("機械的な列挙")) continue;
    const mode = line.includes("始めない") ? "start" : "any";
    for (const m of line.matchAll(/「([^」]+)」/g)) { const w = m[1].replace(/〜/g, "").trim(); if (w) out.push([w, mode]); }
  }
  return (ngCache = out);
}
function specOf(c, meta) {
  const y = (channelsCache || []).find((x) => x.id === c.ch)?.raw || "";
  const num = (re) => { const m = y.match(re); return m ? m.slice(1) : null; };
  let len, heads;
  const t = meta.type && num(new RegExp(`^\\s+${meta.type}:\\s*\\{min:\\s*(\\d+),\\s*max:\\s*(\\d+),\\s*unit:\\s*(\\w+),\\s*headings:\\s*\\{min:\\s*(\\d+),\\s*max:\\s*(\\d+)`, "m"));
  if (t) { len = { min: +t[0], max: +t[1], unit: t[2] }; heads = { min: +t[3], max: +t[4] }; }
  else {
    const l = num(/^length:\s*\{min:\s*(\d+),\s*max:\s*(\d+),\s*unit:\s*(\w+)/m), h = num(/^headings:\s*\{min:\s*(\d+),\s*max:\s*(\d+)/m);
    len = l ? { min: +l[0], max: +l[1], unit: l[2] } : null; heads = h ? { min: +h[0], max: +h[1] } : null;
  }
  if (len && c.st === "ja" && len.unit === "words") len = { min: Math.floor(len.min * 1.6), max: Math.floor(len.max * 2.6), unit: "chars" };
  const aff = (y.match(/^affiliates:\s*(.+)$/m) || [])[1]?.replace(/\s+#.*$/, "").trim() || "";
  return { len, heads, aff };
}

  const t = body.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[#*>`_|\-]/g, " ");
  return unit === "words" ? (t.match(/[A-Za-z0-9][A-Za-z0-9'’.,%-]*/g) || []).length : t.replace(/\s/g, "").length;
}
async function checkBody(c, text) {
  const { meta, body } = splitFront(text);
  const sp = specOf(c, meta);
  const errs = [], warns = [], info = [];
  if (sp.len) {
    const n = bodyLength(body, sp.len.unit), u = sp.len.unit === "words" ? "語" : "字";
    const ok = sp.len.min * 0.8 <= n && n <= sp.len.max * 1.5;
    (ok ? info : errs).push(`本文 ${n.toLocaleString()}${u}(目安 ${sp.len.min.toLocaleString()}〜${sp.len.max.toLocaleString()}${u})`);
  }
  const h2 = (body.match(/^## /gm) || []).length;
  if (sp.heads) (sp.heads.min <= h2 && h2 <= sp.heads.max + 1 ? info : errs).push(`見出し(##)${h2}個(目安 ${sp.heads.min}〜${sp.heads.max}個)`);
  if (/[—―]/.test(text)) errs.push("エムダッシュ(— / ―)があります");
  const plain = body.replace(/[【】]/g, "");
  for (const [w, mode] of await ngWords()) {
    const hit = mode === "start" ? body.split("\n").some((l) => l.replace(/^#+\s*/, "").startsWith(w))
      : (/^[一-龠々]$/.test(w) ? new RegExp(`(?<![一-龠々])${w}(?![一-龠々])`) : new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))).test(plain);
    if (hit) warns.push(`NG表現「${w}」(voice-tone)`);
  }
  // 広告の目印
  const lines = body.split("\n");
  const marks = [], inline = [];
  lines.forEach((l) => { const m = l.trim().match(/^\[\[ad:([a-z0-9-]+)(:banner)?\]\]$/); if (m) marks.push({ id: m[1], banner: !!m[2] }); else if (/\[\[ad:/.test(l)) inline.push(l.trim()); });
  if (inline.length) errs.push(`広告の目印は1行に単独で置く: ${inline[0].slice(0, 40)}`);
  if (marks.length) {
    if (!sp.aff || sp.aff === "[]") errs.push("この媒体では広告を使えません(channel.yml の affiliates)");
    else {
      let list = [];
      try { list = parseAds((await getFile(ADS_PATH, "", SITE_REPO)).text).ads.filter((a) => a.active); } catch {}
      const active = list.map((a) => a.id), type = Object.fromEntries(list.map((a) => [a.id, a.type]));
      const allowed = sp.aff === "all" || sp.aff === "true" ? active : active.filter((a) => sp.aff.includes(a));
      for (const m of marks) if (!allowed.includes(m.id)) errs.push(`広告 ${m.id} は使えない(配信停止中か、この媒体で許可されていない)`);
      // サービス(3種類・文字リンク3・バナー1)と商品(別枠で3つ、同じ商品は1回)は別に数える(build.py の check_ads と同じ)
      const prods = marks.filter((m) => type[m.id] === "product"), svc = marks.filter((m) => type[m.id] !== "product");
      const texts = svc.filter((m) => !m.banner);
      if (new Set(svc.map((m) => m.id)).size > 3) errs.push("広告(サービス)は1記事3種類まで");
      if (texts.length > 3) errs.push("広告の文字リンクは3つまで");
      if (new Set(texts.map((m) => m.id)).size !== texts.length) errs.push("同じ広告の文字リンクが2回以上ある");
      if (svc.filter((m) => m.banner).length > 1) errs.push("広告のバナーは1つまで");
      if (prods.some((m) => m.banner)) errs.push("商品リンクにバナーはない([[ad:名前]] で置く)");
      if (prods.length > 3) errs.push("商品リンクは1記事3つまで");
      if (new Set(prods.map((m) => m.id)).size !== prods.length) errs.push("同じ商品が2回以上ある");
      info.push(`広告の目印 ${svc.length}か所・商品リンク ${prods.length}か所`);
    }
  }
  if (c.ch === "site") {
    if (body.includes("この記事を書いた人")) errs.push("「この記事を書いた人」はテンプレートが入れるので本文に書かない");
    if (/\[[^\]]*\.html\]\(/.test(body)) errs.push("リンクの表示文字がファイル名になっている");
  }
  return { errs, warns, info, at: new Date() };

// ---------- 編集長の提案 ----------
function queueBlocks(text) {
  const lines = text.split("\n"); const blocks = []; let cur = null, key = "";
  lines.forEach((l, i) => {
    const m = l.match(/^  - slug:\s*(\S+)/);
    if (m) { cur = { slug: m[1], start: i, end: i, fields: {}, refs: [] }; blocks.push(cur); return; }
    if (cur && /^    \S/.test(l)) {
      cur.end = i; const f = l.match(/^    (\w+):\s*(.*)$/);
      if (f) {
        key = f[1]; cur.fields[key] = f[2].replace(/^['"](.*)['"]$/, "$1");
        if (key === "reference_videos" && f[2].trim().startsWith("[")) {
          try { cur.refs = JSON.parse(f[2]); } catch { cur.refs = f[2].replace(/^\[|\]$/g, "").split(",").map(unq).filter(Boolean); }
        }
      }
      return;
    }
    if (cur && /^ {6}/.test(l)) {  // reference_videos を複数行で書いた場合
      cur.end = i; const v = l.match(/^\s+-\s*(.+)$/);
      if (v && key === "reference_videos") cur.refs.push(unq(v[1]));
      return;
    }
    cur = null;
  });
  return { lines, blocks };
}
const refLinks = (refs) => (refs || []).filter((u) => /^https:\/\//.test(u)).map((u, i) =>
  `<a href="${esc(u)}" target="_blank" rel="noopener">参考動画${i + 1}</a>`).join(" ");
// 見送ったネタを channels/<ch>/rejected.yml に残す(編集長が同じネタを出し直さないように)
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
async function addRejected(ch, blocks, branch) {
  if (!blocks.length) return;
  const path = `channels/${ch}/rejected.yml`;
  const f = await getFile(path, branch).catch(() => ({ text: "# 見送ったネタ。編集長は、ここにあるネタと同じ切り口のネタを出さない。\ntopics: []\n", sha: undefined }));
  const lines = f.text.replace(/\n+$/, "").replace(/^topics:\s*\[\]\s*$/m, "topics:").split("\n");
  for (const b of blocks) {
    lines.push(`  - slug: ${b.slug}`, `    keyword: ${yq(b.fields.keyword || "")}`, `    angle: ${yq(b.fields.angle || "")}`, `    date: ${today()}`);
  }
  await putFile(path, lines.join("\n") + "\n", f.sha, `見送りを記録(${ch}): ${blocks.map((b) => b.slug).join(", ")}`, branch);
}
// ネタの重なり(本社の tools/topics.py の「キーワードがほぼ同じ」と同じ考え方の簡易版)
const KW_STOP = new Set(["japan", "japanese", "tax", "taxes", "the", "a", "an", "in", "for", "of", "and", "to", "on", "how", "what", "is", "vs", "とは", "方法", "やり方", "違い", "まとめ"]);
const kwTokens = (k) => new Set(String(k || "").normalize("NFKC").toLowerCase().split(/[\s、,/・]+/).filter((t) => t && !KW_STOP.has(t)));
function nearTopic(kw, blocks) {
  const a = kwTokens(kw); if (!a.size) return null;
  for (const b of blocks) {
    const c = kwTokens(b.fields.keyword); if (!c.size) continue;
    const inter = [...a].filter((t) => c.has(t)).length, small = Math.min(a.size, c.size);
    if (inter / new Set([...a, ...c]).size >= 0.6 || (small >= 2 && inter === small)) return b;
  }
  return null;
}

const YT_PATH = "shared/youtube_channels.yml";
const YT_GENRES = ["転職・キャリア", "税務・会計"];  // ファイルに genres: が無いときの既定
const NO_GENRE = "未分類";
function parseYt(text) {
  const lines = text.split("\n");
  const at = lines.findIndex((l) => /^(genres|channels):/.test(l));
  const head = (at < 0 ? lines : lines.slice(0, at)).join("\n").replace(/\n+$/, "");
  const gl = (lines.find((l) => /^genres:/.test(l)) || "").match(/^genres:\s*\[(.*)\]\s*$/);
  const genres = gl ? gl[1].split(",").map(unq).filter(Boolean) : [...YT_GENRES];
  const ci = lines.findIndex((l) => /^channels:/.test(l));
  const list = []; let m;
  for (const l of ci < 0 ? [] : lines.slice(ci + 1)) {
    if ((m = l.match(/^  - handle:\s*(.+)$/))) list.push({ handle: unq(m[1]), genre: "", memo: "" });
    else if ((m = l.match(/^  - (["']?@.+)$/))) list.push({ handle: unq(m[1]), genre: "", memo: "" });
    else if ((m = l.match(/^    (genre|memo):\s*(.*)$/)) && list.length) list[list.length - 1][m[1]] = unq(m[2]);
  }
  return { head, genres, list };
}
const dumpYt = ({ head, genres, list }) => [head, `genres: [${genres.map(yq).join(", ")}]`, "channels:",
  ...list.flatMap((c) => [`  - handle: ${yq(c.handle)}`, `    genre: ${yq(c.genre || NO_GENRE)}`, `    memo: ${yq(c.memo || "")}`])].join("\n") + "\n";
function normHandle(v) {
  v = v.trim().replace(/^https?:\/\/(www\.|m\.)?youtube\.com\//, "").replace(/[/?#].*$/, "");
  if (v && !v.startsWith("@")) v = "@" + v;
  return /^@[A-Za-z0-9._-]{3,30}$/.test(v) ? v : "";
}

// ---------- 広告(公開サイトの content/affiliates.yml) ----------
const ADS_PATH = "content/affiliates.yml";
const AD_FIELDS = [
  ["name", "名前", "例:ツインプロ / 日商簿記2級のテキスト", true],
  ["about", "どんなものか(1行)", "例:会計士・会計業界向けの転職支援サービス", true],
  ["fit", "合う読者・記事", "例:会計業界での転職を考える経験者 / 簿記2級の独学の記事", true],
  ["avoid", "合わない記事(任意)", "例:未経験向けの記事", false],
  ["lead_hint", "置き方のヒント(任意)", "例:求人を見たい人向けに一言添えてから置く", false],
];
const AD_TYPES = { service: "サービス", product: "商品" };
// 商品を誰が使っていたか(必須)。記事はこの立場どおりに書き分ける。誰も使っていない商品は登録しない
const AD_SOURCES = { self: "自分が使っていた", classmate: "同じ教室の友人が使っていた", senior: "職場の先輩税理士が受験生時代に使っていた" };
const unq = (v) => { v = v.trim(); if (/^".*"$/.test(v)) return v.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, "\\"); if (/^'.*'$/.test(v)) return v.slice(1, -1).replace(/''/g, "'"); return v; };
function parseAds(text) {
  const lines = text.split("\n");
  const at = lines.findIndex((l) => /^ads:\s*$/.test(l));
  const head = (at < 0 ? lines : lines.slice(0, at)).join("\n").replace(/\n+$/, "");
  const ads = [];
  let cur = null, block = null;
  for (const l of at < 0 ? [] : lines.slice(at + 1)) {
    let m;
    if (block && (/^ {6}/.test(l) || l.trim() === "")) { cur[block].push(l.slice(6)); continue; }
    block = null;
    if ((m = l.match(/^  ([a-z0-9-]+):\s*$/))) { cur = { id: m[1], active: true, type: "service", source: "", text: [], banner: [], code: [] }; ads.push(cur); continue; }
    if (!cur) continue;
    if ((m = l.match(/^    (text|banner|code):\s*\|-?\s*$/))) { block = m[1]; cur[block] = []; continue; }
    if ((m = l.match(/^    ([a-z_]+):\s*(.*)$/))) cur[m[1]] = m[1] === "active" ? m[2].trim() !== "false" : unq(m[2]);
  }
  for (const a of ads) {
    for (const k of ["text", "banner", "code"]) a[k] = (Array.isArray(a[k]) ? a[k].join("\n") : a[k] || "").trim();
    a.type = a.type === "product" ? "product" : "service";
  }
  return { head, ads };
}
function dumpAds({ head, ads }) {
  const out = [head, "ads:"];
  for (const a of ads) {
    out.push(`  ${a.id}:`, `    active: ${a.active ? "true" : "false"}`, `    type: ${a.type === "product" ? "product" : "service"}`);
    if (a.name) out.push(`    name: ${yq(a.name)}`);  // about・fit などは非公開側(saveAdNotes)にだけ書く
    for (const k of a.type === "product" ? ["code"] : ["text", "banner"]) if (a[k]) out.push(`    ${k}: |`, ...a[k].trim().split("\n").map((l) => "      " + l.trimEnd()));
  }
  return out.join("\n") + "\n";
}
async function saveAds(data, sha, msg) {
  await putFileTo(SITE_REPO, ADS_PATH, dumpAds(data), sha, msg);
}

async function loadAdNotes() {

    if (cur && (m = l.match(/^    ([a-z_]+):\s*(.*)$/)) && NOTE_KEYS.includes(m[1])) cur[m[1]] = unq(m[2]);
  }

  view.innerHTML = `
  <div class="card pad stack" style="margin-top:16px">
    <p class="meta">ASP(A8・もしもアフィリエイトなど)で発行したコードを、そのまま貼ってください。コードは書き換えずに記事へ入ります。</p>
    <label>種類<select id="ad_type">${Object.entries(AD_TYPES).map(([k, v]) => `<option value="${k}" ${k === type0 ? "selected" : ""}>${v}${k === "product" ? "(本・道具など。ボックスで表示)" : "(転職サービスなど)"}</option>`).join("")}</select></label>
    <label>目印の名前(半角英小文字・数字・ハイフン)<input type="text" id="ad_id" value="${esc(a.id || "")}" ${id ? "disabled" : ""} placeholder="例:twinpro / boki2-text"></label>
    ${AD_FIELDS.map(([k, label, ph]) => `<label>${label}<input type="text" id="ad_${k}" value="${esc(a[k] || "")}" placeholder="${esc(ph)}"></label>`).join("")}
    <div class="stack" id="svcBox">
      <label>文字リンクのコード<textarea id="ad_text" rows="4" placeholder="&lt;a href=...&gt;...&lt;/a&gt; と 1x1 の &lt;img&gt; をまとめて貼る">${esc(a.text || "")}</textarea></label>
      <label>バナーのコード(任意)<textarea id="ad_banner" rows="4">${esc(a.banner || "")}</textarea></label>
    </div>
    <div class="stack" id="prodBox">
      <label>誰が使っていたか(必須)<select id="ad_source"><option value="">選んでください</option>${Object.entries(AD_SOURCES).map(([k, v]) => `<option value="${k}" ${k === a.source ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <p class="meta">誰も使っていない商品は登録しないでください。記事は、選んだ立場のとおりに書き分けます(友人・先輩の物を自分が使っていたようには書きません)。この2つの欄は非公開の本社リポジトリに保存し、公開リポジトリには書きません。</p>
      <label>使っていた様子や感想(記事に書けるのはここにある範囲だけ)<textarea id="ad_note" rows="3" placeholder="例:簿記論の受験中に2年使っていた。論点ごとの例題が多くて復習しやすかった(友人・先輩の名前や会社名は書かない)">${esc(a.note || "")}</textarea></label>
      <label>商品リンクのコード<textarea id="ad_code" rows="5" placeholder="もしもアフィリエイトの「かんたんリンク」のコードなどをまとめて貼る">${esc(a.code || "")}</textarea></label>
    </div>
  </div>
  <div class="bar"><button class="act" id="saveAd">${id ? "保存する" : "追加する"}</button></div>`;
  const sync = () => {
    const prod = $("#ad_type").value === "product";
    $("#svcBox").hidden = prod; $("#prodBox").hidden = !prod;
  };
  $("#ad_type").onchange = sync; sync();
  $("#saveAd").onclick = async () => {
    const v = (k) => $(`#ad_${k}`).value.trim();
    const nid = id || v("id");
    const type = $("#ad_type").value === "product" ? "product" : "service";
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(nid)) return toast("目印の名前は半角英小文字・数字・ハイフンだけです");
    if (!id && data.ads.some((x) => x.id === nid)) return toast("同じ名前の広告がすでにあります");
    for (const [k, label, , req] of AD_FIELDS) if (req && !v(k)) return toast(`${label}を入れてください`);
    if (type === "product") {
      const c = v("code");
      if (!c) return toast("商品リンクのコードを貼ってください");
      // <script> は、もしもアフィリエイトのかんたんリンク(msmstatic.com)だけ通す
      if (/<script/i.test(c) && !/msmstatic\.com|MoshimoAffiliateEasyLink/i.test(c)) return toast("<script> を含むコードは、もしもアフィリエイトの「かんたんリンク」だけ使えます");
      if (!/<a\s[^>]*href=|msmaflink/i.test(c)) return toast("商品リンクのコードに <a href=...> かかんたんリンクがありません");
      if (!AD_SOURCES[v("source")]) return toast("誰が使っていたかを選んでください(誰も使っていない商品は登録しない)");
      if (/—/.test(v("note"))) return toast("エムダッシュは使えません");
    } else {
      if (!v("text") && !v("banner")) return toast("文字リンクかバナーのコードを貼ってください");
      for (const k of ["text", "banner"]) {
        const c = v(k);
        if (!c) continue;
        if (/<script/i.test(c)) return toast("<script> を含むコードは使えません。A8などの「テキスト」「バナー」のコードを選んでください");
        if (!/<a\s[^>]*href=/i.test(c)) return toast(`${k === "text" ? "文字リンク" : "バナー"}のコードに <a href=...> がありません`);
      }
    }
    const next = { ...a0, id: nid, type, name: v("name") };  // 公開側に書くもの(name / type / active / コード)
    for (const k of NOTE_KEYS) delete next[k];
    const note = {};                                               // 非公開側に書くもの
    for (const [k] of AD_FIELDS) if (k !== "name") note[k] = v(k);
    if (type === "product") { note.source = v("source"); note.note = v("note"); }
    if (type === "product") {
      next.code = v("code");
      next.text = ""; next.banner = "";
    } else {
      next.text = v("text"); next.banner = v("banner"); next.code = "";
    }
    if (id) data.ads[data.ads.findIndex((x) => x.id === id)] = next; else data.ads.push(next);
    $("#saveAd").disabled = true;
    try {
      // 先に非公開側(説明・合う記事・誰が使っていたか)。失敗したら公開側は書かない
      pn.notes[nid] = note;
      await saveAdNotes(pn.notes, pn.sha, `広告の説明を${id ? "更新" : "追加"}: ${next.name}`);
      await saveAds(data, f.sha, `広告を${id ? "更新" : "追加"}: ${next.name}`);
      toast("保存しました。今夜の記事から使われます"); history_.pop(); go(adsView, "広告", false);
    } catch (e) { toast(e.message); $("#saveAd").disabled = false; }
  };
}

// Slack の「デスクで読む」から #pr-123 で直接開く
async function openFromHash() {
  const m = location.hash.match(/^#pr-(\d+)$/);
  if (!m || !token) return false;
  history.replaceState(null, "", location.pathname);
  try {
    await loadChannels().catch(() => []);
    const pr = await gh(`${R}/pulls/${m[1]}`);
    current = { fn: inbox, title: "決裁デスク" };
    const isEditor = pr.labels.some((l) => l.name === "editor");
    go(() => (isEditor ? proposal(+m[1]) : draft(+m[1])), isEditor ? "ネタの提案" : "下書き");
    return true;
  } catch (e) { toast(e.message); return false; }
}
openFromHash().then((ok) => { if (!ok) home(); });
checkDeskUpdate();
</script>
