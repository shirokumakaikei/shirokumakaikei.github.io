<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>決裁デスク | しろくま</title>
<link rel="icon" href="data:,">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
/* スマホ1列。上から「要対応 → AI社員の稼働 → 方向を決める」。あなたが押すボタンだけオレンジ */
:root {
  --bg: #f4f7fa; --card: #ffffff; --fg: #172231; --muted: #5a6a7e; --line: #d5dde7;
  --accent: #1f5585; --accent-soft: #e6eef6; --act: #b4541f; --act-soft: #fbeee5;
  --ok: #2e7d4f; --warn: #a86a00; --ng: #b23b3b;
  --font: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #10161e; --card: #18212c; --fg: #e4ebf2; --muted: #9aaabd; --line: #2f3c4d;
    --accent: #84b6e4; --accent-soft: #1d2a38; --act: #f0a070; --act-soft: #3a2619;
    --ok: #6cc28f; --warn: #e3b14f; --ng: #ef7d7d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
header.top h1 { font-size: 1.05rem; margin: 0; flex: 1; letter-spacing: 0.04em; }
button, .btn { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  padding: 8px 14px; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.ghost { background: transparent; }
button.act { background: var(--act); border-color: var(--act); color: #fff; font-weight: 700; }
button.sub { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
button.danger { color: var(--ng); }
button.armed { outline: 2px solid currentColor; }
button:disabled { opacity: 0.5; cursor: default; }
h2 { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.08em; margin: 28px 0 10px; font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.list { display: grid; gap: 0; }
.item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: 0.82rem; }
.chip { font-size: 0.72rem; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.draft { color: var(--act); } .chip.editor { color: var(--accent); } .chip.ops { color: var(--ng); }
.chip.ok { color: var(--ok); } .chip.run { color: var(--warn); } .chip.ng { color: var(--ng); } .chip.idle { color: var(--muted); } .chip.warn { color: var(--warn); }
.empty { padding: 16px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 12px; }
.pad { padding: 16px; }
.warn { border-left: 4px solid var(--warn); background: var(--act-soft); padding: 12px 14px; border-radius: 8px; }
.warn h3 { margin: 0 0 6px; font-size: 0.9rem; }
.md { overflow-wrap: anywhere; }
.md h1 { font-size: 1.1rem; } .md h2 { font-size: 1rem; color: var(--fg); letter-spacing: 0; margin: 18px 0 6px; }
.md h3 { font-size: 0.95rem; margin: 14px 0 4px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 0.85rem; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
.md code { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
iframe.preview { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff; min-height: 400px; }
textarea, input[type=text], input[type=password], select { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea { min-height: 96px; resize: vertical; }
[hidden] { display: none !important; }
label { font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
.bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin-top: 16px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; z-index: 10; max-width: 90vw; }
.meta { color: var(--muted); font-size: 0.82rem; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { margin-top: 5px; width: 20px; height: 20px; flex: none; }
.count { min-width: 1.6em; text-align: center; font-weight: 700; color: var(--act); }
@media (prefers-reduced-motion: no-preference) { .item:active { background: var(--accent-soft); } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="ghost" id="back" hidden aria-label="戻る">←</button>
  <h1 id="title">決裁デスク</h1>
  <button class="ghost" id="reload" aria-label="更新">更新</button>
  <button class="ghost" id="settingsBtn" aria-label="設定">設定</button>
</div></header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// 本社(非公開)にAI社員の下書き・ネタ帳・体験がある。公開サイトのリポジトリは公開処理の状況を見るだけ
const OFFICE = "shirokumakaikei/shirokuma-office";
const SITE_REPO = "shirokumakaikei/shirokumakaikei.github.io";
const SITE = "https://shirokumakaikei.github.io";
const API = "https://api.github.com";
const CATS = ["実務", "キャリア・転職", "試験・学習"];
const WORKFLOWS = [
  { repo: OFFICE, file: "nightly.yml", label: "ライター+校閲(今夜の担当)", runnable: true, channelInput: true },
  { repo: OFFICE, file: "comment.yml", label: "書き直し・英訳", runnable: false },
  { repo: OFFICE, file: "weekly.yml", label: "アナリスト+編集長", runnable: true },
  { repo: OFFICE, file: "publish.yml", label: "サイトへの反映", runnable: false },
  { repo: SITE_REPO, file: "deploy.yml", label: "サイト公開処理", runnable: true },
];
const STAGE_LABEL = { ja: "日本語版", en: "英語版", final: "下書き" };

const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get("desk.token");

const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => DOMPurify.sanitize(marked.parse(String(s || "")));
// 広告の目印はプレビューでは仮の枠で見せる(本物のコードを読み込むと表示回数が計上されるため)
const adPreview = (s) => String(s || "").replace(/^\[\[ad:([a-z0-9-]+)(:banner)?\]\]\s*$/gm, (_, n, b) => b
  ? `\n<div class="ad-banner"><div style="display:inline-flex;align-items:center;justify-content:center;width:300px;max-width:100%;height:250px;border:2px dashed #b9c6d6;color:#4a5a70">広告バナー: ${n}</div></div>\n`
  : `\n<div class="ad-text"><a href="#">広告(文字リンク): ${n}</a></div>\n`);
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${m}分前`;
  if (m < 60 * 24) return `${Math.round(m / 60)}時間前`;
  return `${Math.round(m / 1440)}日前`;
};
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200);
}
function b64decode(s) {
  const bin = atob(s.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function twoTap(btn, label, fn) {
  btn.addEventListener("click", async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); const orig = btn.textContent; btn.textContent = label;
      setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 4000);
      return;
    }
    btn.disabled = true;
    try { await fn(); } catch (e) { toast(e.message); btn.disabled = false; }
  });
}

// ---------- GitHub API ----------
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (res.status === 401) throw new Error("トークンが無効です。設定から入れ直してください");
  if (!res.ok && res.status !== 204) {
    let msg = res.statusText; try { msg = (await res.json()).message || msg; } catch {}
    if (res.status === 403 || res.status === 404) msg += "(トークンの権限と対象リポジトリを確認してください)";
    throw new Error(`GitHub ${res.status}: ${msg}`);
  }
  return res.status === 204 ? null : res.json();
}
const R = `/repos/${OFFICE}`;
const getFile = async (path, ref, repo = OFFICE) => {
  const j = await gh(`/repos/${repo}/contents/${path}${ref ? `?ref=${encodeURIComponent(ref)}` : ""}`);
  return { text: b64decode(j.content), sha: j.sha };
};
const putFile = (path, text, sha, message, branch) =>
  gh(`${R}/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64encode(text), sha, ...(branch ? { branch } : {}) }) });
const putFileTo = (repo, path, text, sha, message) =>
  gh(`/repos/${repo}/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64encode(text), ...(sha ? { sha } : {}) }) });
const labelOf = (p, prefix) => (p.labels.find((l) => l.name.startsWith(prefix)) || {}).name?.slice(prefix.length) || "";

// 媒体の一覧(channels/*/channel.yml)
let channelsCache = null;
async function loadChannels() {
  if (channelsCache) return channelsCache;
  const dirs = (await gh(`${R}/contents/channels`)).filter((d) => d.type === "dir" && !d.name.startsWith("_"));
  const list = await Promise.all(dirs.map(async (d) => {
    try {
      const y = (await getFile(`channels/${d.name}/channel.yml`)).text;
      const get = (k) => (y.match(new RegExp(`^${k}:\\s*(.+)$`, "m")) || [])[1]?.replace(/\s+#.*$/, "").trim();
      return { id: d.name, name: get("name") || d.name, enabled: get("enabled") === "true",
               types: /^types:/m.test(y), categories: /^categories:/m.test(y), twoStage: get("two_stage") === "true",
               research: get("research") || "false" };
    } catch { return null; }
  }));
  channelsCache = list.filter(Boolean);
  return channelsCache;
}
const chName = (id) => (channelsCache || []).find((c) => c.id === id)?.name || id;

// ---------- 画面遷移 ----------
const history_ = [];
let current = null;
function go(fn, title, push = true) {
  if (push && current) history_.push(current);
  current = { fn, title };
  $("#title").textContent = title; $("#back").hidden = history_.length === 0;
  view.innerHTML = '<p class="empty">読み込み中…</p>';
  window.scrollTo(0, 0);
  fn().catch((e) => { view.innerHTML = `<div class="card pad"><p>${esc(e.message)}</p></div>`; });
}
$("#back").onclick = () => { const p = history_.pop(); if (p) go(p.fn, p.title, false); };
$("#reload").onclick = () => { channelsCache = null; current && go(current.fn, current.title, false); };
$("#settingsBtn").onclick = () => go(settings, "設定");
const home = () => { history_.length = 0; go(inbox, "決裁デスク", false); };

// ---------- 設定 ----------
async function settings() {
  view.innerHTML = `
  <h2>このブラウザに保存するトークン</h2>
  <div class="card pad stack">
    <p class="meta">GitHub の fine-grained token を入れてください。保存先はこの端末のブラウザだけで、GitHubへの操作にだけ使います。</p>
    <label>トークン<input type="password" id="tok" autocomplete="off" value="${token ? "••••••••" : ""}"></label>
    <div class="row"><button class="act" id="save">保存</button><button class="danger" id="logout">この端末から削除</button></div>
    <details><summary class="meta">トークンの作り方</summary>
      <ol class="meta">
        <li>GitHub → Settings → Developer settings → Fine-grained tokens</li>
        <li>Resource owner: <b>shirokumakaikei</b> / Repository access: <b>shirokuma-office</b> と <b>shirokumakaikei.github.io</b></li>
        <li>Permissions: Contents・Pull requests・Issues・Actions を Read and write</li>
      </ol></details>
  </div>
  <h2>スマホに通知を出すには</h2>
  <div class="card pad meta">GitHub アプリで <b>shirokuma-office</b> を Watch → All Activity にすると、下書きができたときに通知が来ます。</div>`;
  $("#save").onclick = async () => {
    const v = $("#tok").value.trim();
    if (!v || v.startsWith("•")) return toast("トークンを入力してください");
    token = v;
    try { await gh(R); store.set("desk.token", v); toast("保存しました"); home(); }
    catch (e) { token = store.get("desk.token"); toast(e.message); }
  };
  $("#logout").onclick = () => { store.del("desk.token"); token = ""; toast("この端末から削除しました"); settings(); };
}

// ---------- 受信箱 ----------
async function inbox() {
  if (!token) return settings();
  const [pulls, ops, reports, runs, siteRuns, chans] = await Promise.all([
    gh(`${R}/pulls?state=open&per_page=50`),
    gh(`${R}/issues?labels=ops&state=open&per_page=5`),
    gh(`${R}/issues?labels=analyst-report&state=all&per_page=1`),
    gh(`${R}/actions/runs?per_page=40`).catch(() => ({ workflow_runs: [] })),
    gh(`/repos/${SITE_REPO}/actions/runs?per_page=10`).catch(() => ({ workflow_runs: [] })),
    loadChannels().catch(() => []),
  ]);
  const has = (p, l) => p.labels.some((x) => x.name === l);
  const todo = [
    ...pulls.filter((p) => labelOf(p, "channel:") && !has(p, "editor")).map((p) => {
      const ch = labelOf(p, "channel:"), st = labelOf(p, "stage:") || "final";
      return { kind: st === "ja" ? "editor" : "draft", chip: `${chName(ch)}・${STAGE_LABEL[st] || st}${has(p, "要確認") ? "・要確認" : ""}`,
               t: p.title.replace(/^\[[^\]]*\]\s*/, ""), m: ago(p.updated_at || p.created_at),
               open: () => go(() => draft(p.number), STAGE_LABEL[st] || "下書き") };
    }),
    ...pulls.filter((p) => has(p, "editor")).map((p) => ({ kind: "editor", chip: `編集長・${chName(labelOf(p, "channel:"))}`,
      t: p.title.replace(/^\[編集長\]\s*/, ""), m: ago(p.created_at), open: () => go(() => proposal(p.number), "ネタの提案") })),
    ...ops.map((i) => ({ kind: "ops", chip: "運用", t: i.title, m: `${ago(i.updated_at)} / コメント${i.comments}件`,
      open: () => go(() => opsView(i.number), "運用のお知らせ") })),
  ];
  const lastRun = (w) => ((w.repo === OFFICE ? runs : siteRuns).workflow_runs || []).find((r) => r.path?.endsWith("/" + w.file));
  const runChip = (r) => {
    if (!r) return '<span class="chip idle">未実行</span>';
    if (r.status !== "completed") return '<span class="chip run">実行中</span>';
    if (r.conclusion === "success") return '<span class="chip ok">完了</span>';
    if (r.conclusion === "skipped" || r.conclusion === "cancelled") return '<span class="chip idle">スキップ</span>';
    return '<span class="chip ng">失敗</span>';
  };
  const enabled = chans.filter((c) => c.enabled);
  const rep = reports[0];
  view.innerHTML = `
  <h2>要対応 <span class="count">${todo.length}</span></h2>
  <div class="card list" id="todo">${todo.length ? "" : '<p class="empty">いま判断が必要なものはありません。</p>'}</div>
  <h2>週報</h2>
  <div class="card list">${rep ? `<button class="item" id="rep"><div class="main"><div class="t">${esc(rep.title)}</div><div class="m">${ago(rep.created_at)}</div></div>›</button>` : '<p class="empty">まだ週報はありません。</p>'}</div>
  <h2>AI社員の稼働</h2>
  <div class="card list">${WORKFLOWS.map((w, i) => { const r = lastRun(w); return `
    <div class="item" style="cursor:default;flex-wrap:wrap"><div class="main"><div class="t">${w.label}</div>
      <div class="m">${r ? ago(r.created_at) : "記録なし"}${r && r.html_url ? ` ・ <a href="${esc(r.html_url)}" target="_blank" rel="noopener">ログ</a>` : ""}</div></div>
      ${runChip(r)}
      ${w.channelInput ? `<select data-ch="${i}" aria-label="媒体" style="width:auto">${enabled.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select>` : ""}
      ${w.runnable ? `<button class="sub" data-run="${i}">今すぐ</button>` : ""}</div>`; }).join("")}</div>
  <h2>方向を決める</h2>
  <div class="card list">
    <button class="item" id="addTopic"><div class="main"><div class="t">ネタを追加する</div><div class="m">媒体を選んで、次に書かせるテーマを入れる</div></div>›</button>
    <button class="item" id="queue"><div class="main"><div class="t">ネタ帳を見る</div><div class="m">媒体ごとの、これから書く順番</div></div>›</button>
    <button class="item" id="ytch"><div class="main"><div class="t">参考チャンネル</div><div class="m">編集長が週1で見る YouTube チャンネルの追加・削除・ジャンル分け</div></div>›</button>
    <button class="item" id="addExp"><div class="main"><div class="t">体験を追加する</div><div class="m">全媒体で使える実体験を足す</div></div>›</button>
    <button class="item" id="ads"><div class="main"><div class="t">広告を管理する</div><div class="m">アフィリエイトの追加・停止・削除(しろくま会計)</div></div>›</button>
  </div>
  <p class="meta" style="margin-top:20px"><a href="${SITE}/" target="_blank" rel="noopener">しろくま会計を開く</a> ・ <a href="https://github.com/${OFFICE}" target="_blank" rel="noopener">本社(GitHub)</a></p>`;
  const list = $("#todo");
  todo.forEach((x) => {
    const b = document.createElement("button"); b.className = "item";
    b.innerHTML = `<span class="chip ${x.kind}">${esc(x.chip)}</span><div class="main"><div class="t">${esc(x.t)}</div><div class="m">${esc(x.m)}</div></div>›`;
    b.onclick = x.open; list.appendChild(b);
  });
  if (rep) $("#rep").onclick = () => go(() => report(rep.number), "週報");
  view.querySelectorAll("[data-run]").forEach((b) => twoTap(b, "実行する", async () => {
    const w = WORKFLOWS[+b.dataset.run];
    const sel = view.querySelector(`[data-ch="${b.dataset.run}"]`);
    const body = { ref: "main", ...(w.channelInput && sel ? { inputs: { channel: sel.value } } : {}) };
    await gh(`/repos/${w.repo}/actions/workflows/${w.file}/dispatches`, { method: "POST", body: JSON.stringify(body) });
    toast("実行を依頼しました。数十秒後に「更新」で状況が出ます"); b.textContent = "依頼済み";
  }));
  $("#addTopic").onclick = () => go(addTopic, "ネタを追加");
  $("#queue").onclick = () => go(queueView, "ネタ帳");
  $("#addExp").onclick = () => go(addExperience, "体験を追加");
  $("#ytch").onclick = () => go(ytChannelsView, "参考チャンネル");
  $("#ads").onclick = () => go(adsView, "広告");
}

// ---------- 下書き ----------
function splitFront(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return { meta: {}, body: text };
  const meta = {};
  m[1].split("\n").forEach((l) => { const k = l.match(/^(\w+):\s*(.*)$/); if (k) meta[k[1]] = k[2].replace(/^"(.*)"$/, "$1"); });
  return { meta, body: m[2] };
}
function warningsFrom(report) {
  const m = String(report || "").match(/### ⚠[^\n]*\n([\s\S]*?)(?=\n#{2,3} |\n*$)/);
  return m ? m[0] : "";
}
async function copyRich(html, plain) {

function queueBlocks(text) {
  const lines = text.split("\n"); const blocks = []; let cur = null, key = "";
  lines.forEach((l, i) => {
    const m = l.match(/^  - slug:\s*(\S+)/);
    if (m) { cur = { slug: m[1], start: i, end: i, fields: {}, refs: [] }; blocks.push(cur); return; }
    if (cur && /^    \S/.test(l)) {
      cur.end = i; const f = l.match(/^    (\w+):\s*(.*)$/);
      if (f) {
        key = f[1]; cur.fields[key] = f[2].replace(/^['"](.*)['"]$/, "$1");
        if (key === "reference_videos" && f[2].trim().startsWith("[")) {
          try { cur.refs = JSON.parse(f[2]); } catch { cur.refs = f[2].replace(/^\[|\]$/g, "").split(",").map(unq).filter(Boolean); }
        }
      }
      return;
    }
    if (cur && /^ {6}/.test(l)) {  // reference_videos を複数行で書いた場合
      cur.end = i; const v = l.match(/^\s+-\s*(.+)$/);
      if (v && key === "reference_videos") cur.refs.push(unq(v[1]));
      return;
    }
    cur = null;
  });
  return { lines, blocks };
}
const refLinks = (refs) => (refs || []).filter((u) => /^https:\/\//.test(u)).map((u, i) =>
  `<a href="${esc(u)}" target="_blank" rel="noopener">参考動画${i + 1}</a>`).join(" ");

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
async function addRejected(ch, blocks, branch) {
  if (!blocks.length) return;
  const path = `channels/${ch}/rejected.yml`;
  const f = await getFile(path, branch).catch(() => ({ text: "# 見送ったネタ。編集長は、ここにあるネタと同じ切り口のネタを出さない。\ntopics: []\n", sha: undefined }));
  const lines = f.text.replace(/\n+$/, "").replace(/^topics:\s*\[\]\s*$/m, "topics:").split("\n");
  for (const b of blocks) {
    lines.push(`  - slug: ${b.slug}`, `    keyword: ${yq(b.fields.keyword || "")}`, `    angle: ${yq(b.fields.angle || "")}`, `    date: ${today()}`);
  }
  await putFile(path, lines.join("\n") + "\n", f.sha, `見送りを記録(${ch}): ${blocks.map((b) => b.slug).join(", ")}`, branch);
}

    const inter = [...a].filter((t) => c.has(t)).length, small = Math.min(a.size, c.size);
    if (inter / new Set([...a, ...c]).size >= 0.6 || (small >= 2 && inter === small)) return b;
  }

}

      if (queueBlocks(q.text).blocks.some((b) => b.slug === slug)) throw new Error("同じURL名のネタがすでにあります");
      const rej = await getFile(`channels/${ch}/rejected.yml`).catch(() => ({ text: "" }));
      const near = nearTopic(kw, [...queueBlocks(q.text).blocks, ...queueBlocks(rej.text).blocks]);
      const warnKey = `${ch}|${kw}`;
      if (near && addTopic.warned !== warnKey) {
        addTopic.warned = warnKey;
        throw new Error(`「${near.fields.keyword}」(${near.slug})と近いネタがすでにあります(ネタ帳か見送り)。それでも入れるなら、もう一度押してください`);
      }
      const block = [`  - slug: ${slug}`];
      if (c.types) block.push(`    type: ${$("#type").value}`);
      block.push(`    keyword: ${yq(kw)}`, `    angle: ${yq(angle)}`);
      if (c.categories) block.push(`    category: ${yq($("#cat").value)}`);
      block.push(`    notes: ${yq($("#notes").value.trim())}`);
      if (c.research === "auto" && $("#res").value) block.push(`    research: ${$("#res").value}`);
      if (refs.length) block.push(`    reference_videos: ${JSON.stringify(refs)}`);
      let lines = q.text.replace(/\n+$/, "").replace(/^topics:\s*\[\]\s*$/m, "topics:").split("\n");
      if ($("#pos").value === "top") {
        const at = lines.findIndex((l) => /^topics:/.test(l));
        lines.splice(at + 1, 0, ...block);
      } else lines.push(...block);
      await putFile(path, lines.join("\n") + "\n", q.sha, `ネタ追加(${ch}): ${kw}`);
      toast("ネタ帳に入れました"); home();
    } catch (e) { toast(e.message); $("#add").disabled = false; }
  };
}

// ---------- 参考チャンネル(shared/youtube_channels.yml) ----------
const YT_PATH = "shared/youtube_channels.yml";
const YT_GENRES = ["転職・キャリア", "税務・会計"];  // ファイルに genres: が無いときの既定
const NO_GENRE = "未分類";
function parseYt(text) {
  const lines = text.split("\n");
  const at = lines.findIndex((l) => /^(genres|channels):/.test(l));
  const head = (at < 0 ? lines : lines.slice(0, at)).join("\n").replace(/\n+$/, "");
  const gl = (lines.find((l) => /^genres:/.test(l)) || "").match(/^genres:\s*\[(.*)\]\s*$/);
  const genres = gl ? gl[1].split(",").map(unq).filter(Boolean) : [...YT_GENRES];
  const ci = lines.findIndex((l) => /^channels:/.test(l));
  const list = []; let m;
  for (const l of ci < 0 ? [] : lines.slice(ci + 1)) {
    if ((m = l.match(/^  - handle:\s*(.+)$/))) list.push({ handle: unq(m[1]), genre: "", memo: "" });
    else if ((m = l.match(/^  - (["']?@.+)$/))) list.push({ handle: unq(m[1]), genre: "", memo: "" });
    else if ((m = l.match(/^    (genre|memo):\s*(.*)$/)) && list.length) list[list.length - 1][m[1]] = unq(m[2]);
  }
  return { head, genres, list };
}
const dumpYt = ({ head, genres, list }) => [head, `genres: [${genres.map(yq).join(", ")}]`, "channels:",
  ...list.flatMap((c) => [`  - handle: ${yq(c.handle)}`, `    genre: ${yq(c.genre || NO_GENRE)}`, `    memo: ${yq(c.memo || "")}`])].join("\n") + "\n";
function normHandle(v) {
  v = v.trim().replace(/^https?:\/\/(www\.|m\.)?youtube\.com\//, "").replace(/[/?#].*$/, "");
  if (v && !v.startsWith("@")) v = "@" + v;
  return /^@[A-Za-z0-9._-]{3,30}$/.test(v) ? v : "";
}
async function ytChannelsView() {
  const f = await getFile(YT_PATH).catch(() => ({ text: "# 編集長が週1で見る参考チャンネル(YouTube)\nchannels:\n", sha: undefined }));
  const data = parseYt(f.text);
  const save = async (msg, done) => { await putFile(YT_PATH, dumpYt(data), f.sha, msg); toast(done); go(ytChannelsView, "参考チャンネル", false); };
  const groups = [...new Set([...data.genres, ...data.list.map((c) => c.genre || NO_GENRE)])];
  const opts = (sel) => groups.map((g) => `<option${g === sel ? " selected" : ""}>${esc(g)}</option>`).join("");
  view.innerHTML = `
  <p class="meta" style="margin-top:16px">編集長が毎週、各チャンネルの直近20本の再生数を見て、伸びている話題をネタの参考にします(全媒体共通)。ジャンルごとにまとめて渡すので、媒体の読者に近いジャンルが主に使われます。動画の中身はなぞらせません。Secret YOUTUBE_API_KEY が無いときは使われません。</p>
  <div id="ytg"></div>
  <h2>追加する</h2>
  <div class="card pad stack">
    <label>チャンネルのURLか @ハンドル<input type="text" id="yt_h" placeholder="例:https://www.youtube.com/@otakuCPA"></label>
    <label>ジャンル<select id="yt_g">${opts(data.genres[0])}<option value="__new">新しいジャンルを作る</option></select></label>
    <label id="yt_ngWrap" hidden>新しいジャンルの名前<input type="text" id="yt_ng" placeholder="例:不動産"></label>
    <label>どういうチャンネルか(任意)<input type="text" id="yt_m" placeholder="例:会計士の転職・キャリア"></label>
  </div>
  <div class="bar"><button class="act" id="ytAdd">追加する</button></div>`;
  groups.forEach((g) => {
    const items = data.list.filter((c) => (c.genre || NO_GENRE) === g);
    const sec = document.createElement("div");
    sec.innerHTML = `<h2>${esc(g)} <span class="count">${items.length}</span></h2><div class="card list">${items.length ? "" : '<div class="item" style="cursor:default"><div class="main"><div class="m">このジャンルのチャンネルはありません。</div></div><button class="danger" data-delg>このジャンルを消す</button></div>'}</div>`;
    const box = sec.querySelector(".list");
    if (!items.length) twoTap(sec.querySelector("[data-delg]"), "本当に消す", async () => {
      data.genres = data.genres.filter((x) => x !== g);
      await save(`参考チャンネルのジャンルを削除: ${g}`, "ジャンルを消しました");
    });
    items.forEach((c) => {
      const d = document.createElement("div"); d.className = "item"; d.style.cursor = "default"; d.style.flexWrap = "wrap";
      d.innerHTML = `<div class="main" style="flex:1 1 60%;min-width:0"><div class="t"><a href="https://www.youtube.com/${encodeURI(c.handle)}" target="_blank" rel="noopener">${esc(c.handle)}</a></div>
        <div class="m">${esc(c.memo || "")}</div></div>
        <div class="row" style="flex-basis:100%;justify-content:flex-end"><select data-genre aria-label="ジャンル" style="width:auto">${opts(c.genre || NO_GENRE)}</select><button class="danger" data-del>削除</button></div>`;
      d.querySelector("[data-genre]").onchange = async (e) => {
        e.target.disabled = true;
        try { c.genre = e.target.value; await save(`参考チャンネルのジャンルを変更: ${c.handle} → ${c.genre}`, "ジャンルを変えました"); }
        catch (err) { toast(err.message); e.target.disabled = false; }
      };
      twoTap(d.querySelector("[data-del]"), "本当に削除", async () => {
        data.list.splice(data.list.indexOf(c), 1);
        await save(`参考チャンネルを削除: ${c.handle}`, "削除しました");
      });
      box.appendChild(d);
    });
    $("#ytg").appendChild(sec);
  });
  $("#yt_g").onchange = () => { $("#yt_ngWrap").hidden = $("#yt_g").value !== "__new"; };
  $("#ytAdd").onclick = async () => {
    const h = normHandle($("#yt_h").value), memo = $("#yt_m").value.trim();
    let genre = $("#yt_g").value;
    if (genre === "__new") genre = $("#yt_ng").value.trim();
    if (!h) return toast("チャンネルのURL(youtube.com/@...)か @ハンドルを入れてください");
    if (!genre) return toast("新しいジャンルの名前を入れてください");
    if (data.list.some((c) => c.handle.toLowerCase() === h.toLowerCase())) return toast("そのチャンネルはもう登録されています");
    if (/—/.test(memo + genre)) return toast("エムダッシュは使えません");
    $("#ytAdd").disabled = true;
    try {
      if (!data.genres.includes(genre)) data.genres.push(genre);
      data.list.push({ handle: h, genre, memo });
      await save(`参考チャンネルを追加: ${h}(${genre})`, "追加しました。次の週から見ます");
    } catch (e) { toast(e.message); $("#ytAdd").disabled = false; }
  };
}

// ---------- 広告(公開サイトの content/affiliates.yml) ----------
const ADS_PATH = "content/affiliates.yml";
const AD_FIELDS = [
  ["name", "サービス名", "例:ツインプロ", true],
  ["about", "どんなサービスか(1行)", "例:会計士・会計業界向けの転職支援サービス", true],
  ["fit", "向く読者", "例:会計業界での転職を考える経験者", true],
  ["avoid", "使わない場面(任意)", "例:未経験向けの記事", false],
  ["lead_hint", "置き方のヒント(任意)", "例:求人を見たい人向けに一言添えてから置く", false],
];
const unq = (v) => { v = v.trim(); if (/^".*"$/.test(v)) return v.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, "\\"); if (/^'.*'$/.test(v)) return v.slice(1, -1).replace(/''/g, "'"); return v; };
function parseAds(text) {
  const lines = text.split("\n");
  const at = lines.findIndex((l) => /^ads:\s*$/.test(l));
  const head = (at < 0 ? lines : lines.slice(0, at)).join("\n").replace(/\n+$/, "");
  const ads = [];
  let cur = null, block = null;
  for (const l of at < 0 ? [] : lines.slice(at + 1)) {
    let m;
    if (block && (/^ {6}/.test(l) || l.trim() === "")) { cur[block].push(l.slice(6)); continue; }
    block = null;
    if ((m = l.match(/^  ([a-z0-9-]+):\s*$/))) { cur = { id: m[1], active: true, text: [], banner: [] }; ads.push(cur); continue; }
    if (!cur) continue;
    if ((m = l.match(/^    (text|banner):\s*\|-?\s*$/))) { block = m[1]; cur[block] = []; continue; }
    if ((m = l.match(/^    ([a-z_]+):\s*(.*)$/))) cur[m[1]] = m[1] === "active" ? m[2].trim() !== "false" : unq(m[2]);
  }
  for (const a of ads) for (const k of ["text", "banner"]) a[k] = (Array.isArray(a[k]) ? a[k].join("\n") : a[k] || "").trim();
  return { head, ads };
}
function dumpAds({ head, ads }) {
  const out = [head, "ads:"];
  for (const a of ads) {
    out.push(`  ${a.id}:`, `    active: ${a.active ? "true" : "false"}`);
    for (const [k] of AD_FIELDS) if (a[k]) out.push(`    ${k}: ${yq(a[k])}`);
    for (const k of ["text", "banner"]) if (a[k]) out.push(`    ${k}: |`, ...a[k].trim().split("\n").map((l) => "      " + l.trimEnd()));
  }
  return out.join("\n") + "\n";
}
async function saveAds(data, sha, msg) {
  await putFileTo(SITE_REPO, ADS_PATH, dumpAds(data), sha, msg);
}
async function adsView() {
  const f = await getFile(ADS_PATH, "", SITE_REPO);
  const data = parseAds(f.text);
  const live = data.ads.filter((a) => a.active).length;
  view.innerHTML = `
  <p class="meta" style="margin-top:16px">ライターは配信中の広告から、記事に合うものを最大3種類選んで入れます。停止・削除すると、新しい記事で使われなくなり、公開済みの記事からも数分で消えます。</p>
  <h2>登録中の広告 <span class="count">${live}/${data.ads.length}</span></h2>
  <div class="card list" id="adl">${data.ads.length ? "" : '<p class="empty">まだ広告はありません。</p>'}</div>
  <div class="bar"><button class="act" id="newAd">広告を追加する</button></div>`;
  data.ads.forEach((a, i) => {
    const d = document.createElement("div"); d.className = "item"; d.style.cursor = "default"; d.style.flexWrap = "wrap";
    d.innerHTML = `<span class="chip ${a.active ? "ok" : "idle"}">${a.active ? "配信中" : "停止中"}</span>
      <div class="main" style="flex:1 1 60%;min-width:0"><div class="t">${esc(a.name || a.id)}</div>
      <div class="m">${esc(a.about || "")}<br>目印: [[ad:${esc(a.id)}]] ・ ${[a.text && "文字リンク", a.banner && "バナー"].filter(Boolean).join("・")}</div></div>
      <div class="row" style="flex-basis:100%;justify-content:flex-end"><button class="sub" data-edit>編集</button><button class="sub" data-toggle>${a.active ? "停止する" : "再開する"}</button><button class="danger" data-del>削除</button></div>`;
    d.querySelector("[data-edit]").onclick = () => go(() => adForm(a.id), "広告を編集");
    d.querySelector("[data-toggle]").onclick = async (e) => {
      e.target.disabled = true;
      try { a.active = !a.active; await saveAds(data, f.sha, `広告を${a.active ? "再開" : "停止"}: ${a.name || a.id}`);
        toast(a.active ? "再開しました" : "停止しました"); go(adsView, "広告", false); }
      catch (err) { toast(err.message); e.target.disabled = false; }
    };
    twoTap(d.querySelector("[data-del]"), "本当に削除", async () => {
      data.ads.splice(i, 1);
      await saveAds(data, f.sha, `広告を削除: ${a.name || a.id}`);
      toast("削除しました"); go(adsView, "広告", false);
    });
    $("#adl").appendChild(d);
  });
  $("#newAd").onclick = () => go(() => adForm(null), "広告を追加");
}
async function adForm(id) {
  const f = await getFile(ADS_PATH, "", SITE_REPO);
  const data = parseAds(f.text);
  const a = id ? data.ads.find((x) => x.id === id) : { active: true };
  if (!a) throw new Error("その広告は見つかりませんでした");
  view.innerHTML = `
  <div class="card pad stack" style="margin-top:16px">
    <p class="meta">ASP(A8など)で発行したコードを、そのまま貼ってください。コードは書き換えずに記事へ入ります。</p>
    <label>目印の名前(半角英小文字・数字・ハイフン)<input type="text" id="ad_id" value="${esc(a.id || "")}" ${id ? "disabled" : ""} placeholder="例:twinpro"></label>
    ${AD_FIELDS.map(([k, label, ph]) => `<label>${label}<input type="text" id="ad_${k}" value="${esc(a[k] || "")}" placeholder="${esc(ph)}"></label>`).join("")}
    <label>文字リンクのコード<textarea id="ad_text" rows="4" placeholder="&lt;a href=...&gt;...&lt;/a&gt; と 1x1 の &lt;img&gt; をまとめて貼る">${esc(a.text || "")}</textarea></label>
    <label>バナーのコード(任意)<textarea id="ad_banner" rows="4">${esc(a.banner || "")}</textarea></label>
  </div>
  <div class="bar"><button class="act" id="saveAd">${id ? "保存する" : "追加する"}</button></div>`;
  $("#saveAd").onclick = async () => {
    const v = (k) => $(`#ad_${k}`).value.trim();
    const nid = id || v("id");
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(nid)) return toast("目印の名前は半角英小文字・数字・ハイフンだけです");
    if (!id && data.ads.some((x) => x.id === nid)) return toast("同じ名前の広告がすでにあります");
    for (const [k, label, , req] of AD_FIELDS) if (req && !v(k)) return toast(`${label}を入れてください`);
    if (!v("text") && !v("banner")) return toast("文字リンクかバナーのコードを貼ってください");
    for (const k of ["text", "banner"]) {
      const c = v(k);
      if (!c) continue;
      if (/<script/i.test(c)) return toast("<script> を含むコードは使えません。A8などの「テキスト」「バナー」のコードを選んでください");
      if (!/<a\s[^>]*href=/i.test(c)) return toast(`${k === "text" ? "文字リンク" : "バナー"}のコードに <a href=...> がありません`);
    }
    const next = { ...a, id: nid };
    for (const [k] of AD_FIELDS) next[k] = v(k);
    next.text = v("text"); next.banner = v("banner");
    if (id) data.ads[data.ads.findIndex((x) => x.id === id)] = next; else data.ads.push(next);
    $("#saveAd").disabled = true;
    try {
      await saveAds(data, f.sha, `広告を${id ? "更新" : "追加"}: ${next.name}`);
      toast("保存しました。今夜の記事から使われます"); history_.pop(); go(adsView, "広告", false);
    } catch (e) { toast(e.message); $("#saveAd").disabled = false; }
  };
}

// Slack の「デスクで読む」から #pr-123 で直接開く
async function openFromHash() {
  const m = location.hash.match(/^#pr-(\d+)$/);
  if (!m || !token) return false;
  history.replaceState(null, "", location.pathname);
  try {
    await loadChannels().catch(() => []);
    const pr = await gh(`${R}/pulls/${m[1]}`);
    current = { fn: inbox, title: "決裁デスク" };
    const isEditor = pr.labels.some((l) => l.name === "editor");
    go(() => (isEditor ? proposal(+m[1]) : draft(+m[1])), isEditor ? "ネタの提案" : "下書き");
    return true;
  } catch (e) { toast(e.message); return false; }
}
openFromHash().then((ok) => { if (!ok) home(); });
