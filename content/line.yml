# LINE 公式アカウント「しろくま」への誘導(記事末尾の枠)。仕組みの全体は非公開リポジトリの docs/line-funnel.md
# build.py が全記事の本文の後ろに、記事のテーマに合わせた枠を入れる。記事の本文には LINE のリンクを書かない
#
# enabled: true にするのは、LINE 公式アカウントを作り、下の add_urls に友だち追加 URL を入れてから
enabled: false

# 友だち追加 URL(LINE 公式アカウントの管理画面 → 友だち追加ガイド → 友だち追加経路 で、経路ごとに作る https://lin.ee/...)。
# 経路ごとに友だち追加の数が分かる。キーは「媒体」か「媒体-テーマ」。記事は「媒体-テーマ」→「媒体」の順に探す
# 媒体: site(しろくま会計)/ lab(しろくまラボ)/ note / x / threads(note・X・Threads は手で貼る。サイトの build は使わない)
add_urls:
  site-career: ""
  site-dx: ""
  site-shikaku: ""
  site: ""
  lab: ""
  note: ""
  x: ""
  threads: ""

# 記事のカテゴリ → テーマ。記事の front matter に line_theme があればそちらを優先。ラボの記事はいつも it
category_theme:
  キャリア・転職: career
  試験・学習: shikaku
  実務: dx

# テーマごとの文面。tag は LINE のアンケートで選ぶタグ(4つ)と同じ名前にする
# gift は友だち追加の特典。実物ができて LINE から渡せるようになったら gift_ready: true にする(それまでは枠に出さない)
themes:
  career:
    tag: 就職・転職
    title: 転職・キャリアの話を LINE でも受け取れます
    text: 税理士事務所と事業会社の経理の両方を経験した立場から、転職や働き方の新しい記事を2週に1回ほどお知らせします。友だち追加のあとのアンケートで、興味のあるテーマを選べます。
    gift: 事務所から事業会社へ移るときの準備チェックリスト
    gift_ready: false
  dx:
    tag: 税務会計DX
    title: 経理・税務の効率化の話を LINE でも受け取れます
    text: 経理の作業を減らす工夫や、税務・会計の実務の記事を2週に1回ほどお知らせします。友だち追加のあとのアンケートで、興味のあるテーマを選べます。
    gift: 経理の作業の棚卸しシート(自動化できる作業の見つけ方つき)
    gift_ready: false
  shikaku:
    tag: 資格
    title: 簿記・税理士試験の話を LINE でも受け取れます
    text: 簿記や税理士試験の勉強の記事を2週に1回ほどお知らせします。友だち追加のあとのアンケートで、興味のあるテーマを選べます。
    gift: 計算用紙(A4 の PDF)
    gift_ready: false
  it:
    tag: IT
    title: 自宅 IT の記録を LINE でも受け取れます
    text: エンジニアではない会計人が、自分で作って費用と電気代まで数字で確かめた自宅 IT の記事を、2週に1回ほどお知らせします。友だち追加のあとのアンケートで、興味のあるテーマを選べます。
    gift: 自宅 NAS の費用・電気代の計算シート
    gift_ready: false

# 枠の下に小さく出す一言
note: 配信は2週に1回ほどです。紹介する記事に広告を含むときは、配信の冒頭に「PR」と書きます。ブロックすればいつでも止められます。
